<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chef Gemini — AI Culinary Assistant</title>
<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">
<style>
  :root {
    --accent: #d84315;
    --accent-hover: #bf360c;
    --accent-light: #fbe9e7;
    --accent-gradient: linear-gradient(135deg, #f57c00 0%, #d84315 100%);
    --bg: #faf7f2;
    --card-bg: #ffffff;
    --border: #e0d7cd;
    --text-main: #2c2523;
    --text-muted: #786c66;
    --user-bubble: #d84315;
    --shadow-sm: 0 2px 8px rgba(216, 67, 21, 0.08);
    --shadow-md: 0 4px 18px rgba(0, 0, 0, 0.06);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    display: flex;
    flex-direction: column;
    height: 100vh;
  }

  header {
    background: var(--accent-gradient);
    color: #ffffff;
    padding: 1.1rem 1.5rem;
    display: flex;
    align-items: center;
    gap: 0.9rem;
    box-shadow: var(--shadow-md);
  }
  .header-icon {
    font-size: 2rem;
    background: rgba(255, 255, 255, 0.2);
    padding: 0.4rem;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .header-titles h1 {
    font-family: 'Outfit', sans-serif;
    margin: 0;
    font-size: 1.4rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }
  .header-titles p {
    margin: 0.15rem 0 0 0;
    font-size: 0.85rem;
    opacity: 0.9;
    font-weight: 400;
  }

  #main-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 860px;
    width: 100%;
    margin: 0 auto;
    overflow: hidden;
    padding: 1rem;
    gap: 1rem;
  }

  #log {
    flex: 1;
    overflow-y: auto;
    padding: 0.5rem 0.5rem 1rem 0.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.2rem;
  }

  /* Dialogue / Message Styling */
  .msg-wrapper {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .msg-wrapper.user { align-items: flex-end; }
  .msg-wrapper.agent { align-items: flex-start; }

  .msg-header {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--text-muted);
    padding: 0 0.4rem;
  }

  .bubble {
    display: inline-block;
    padding: 0.85rem 1.1rem;
    border-radius: 16px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    text-align: left;
    max-width: 88%;
    white-space: pre-wrap;
    line-height: 1.5;
    box-shadow: var(--shadow-sm);
    font-size: 0.96rem;
  }
  .msg-wrapper.user .bubble {
    background: var(--user-bubble);
    color: #ffffff;
    border: none;
    border-bottom-right-radius: 4px;
    box-shadow: 0 4px 12px rgba(216, 67, 21, 0.2);
  }
  .msg-wrapper.agent .bubble {
    border-bottom-left-radius: 4px;
  }

  /* Rich A2UI Card Wrapper */
  .bubble.rich {
    background: transparent;
    border: none;
    padding: 0;
    max-width: 100%;
    white-space: normal;
    box-shadow: none;
  }

  /* Clickable Prompt Chips */
  .prompts-container {
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
  }
  .prompts-title {
    font-size: 0.78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-muted);
    padding: 0 0.2rem;
  }
  .prompts-row {
    display: flex;
    gap: 0.6rem;
    overflow-x: auto;
    padding-bottom: 0.3rem;
    scrollbar-width: thin;
  }
  .prompt-chip {
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.55rem 0.95rem;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 600;
    color: var(--text-main);
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.45rem;
    transition: all 0.2s ease;
    box-shadow: var(--shadow-sm);
  }
  .prompt-chip:hover {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent-hover);
    transform: translateY(-1px);
    box-shadow: 0 4px 10px rgba(216, 67, 21, 0.12);
  }
  .prompt-chip .chip-icon {
    font-size: 1.05rem;
  }

  /* Form & Input Bar */
  form {
    display: flex;
    gap: 0.6rem;
    background: var(--card-bg);
    padding: 0.8rem;
    border-radius: 16px;
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
  }
  input {
    flex: 1;
    padding: 0.75rem 1rem;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 0.98rem;
    font-family: inherit;
    outline: none;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: var(--accent);
  }
  button.send-btn {
    padding: 0.75rem 1.4rem;
    border: none;
    border-radius: 10px;
    background: var(--accent-gradient);
    color: #ffffff;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.1s;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  button.send-btn:hover {
    opacity: 0.93;
    transform: translateY(-1px);
  }

  /* --- A2UI component styles --- */
  .a2card {
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 1.2rem;
    background: var(--card-bg);
    box-shadow: var(--shadow-md);
    max-width: 100%;
  }
  .a2card + .a2card, .a2col > .a2card { margin-top: 0.8rem; }
  .a2col { display: flex; flex-direction: column; gap: 0.6rem; }
  .a2row { display: flex; flex-direction: row; gap: 0.8rem; align-items: center; flex-wrap: wrap; }
  .a2row.between { justify-content: space-between; }
  .a2text { margin: 0; line-height: 1.5; color: var(--text-main); }
  .a2text.a2-h1 { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 700; color: var(--accent-hover); }
  .a2text.a2-h2 { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 700; }
  .a2text.a2-h3 { font-family: 'Outfit', sans-serif; font-size: 1.1rem; font-weight: 600; }
  .a2text.a2-h4 { font-family: 'Outfit', sans-serif; font-size: 1rem; font-weight: 600; }
  .a2text.a2-caption { font-size: 0.85rem; color: var(--text-muted); }
  .a2divider { border: none; border-top: 1px solid var(--border); margin: 0.6rem 0; width: 100%; }
  .a2img { max-width: 100%; border-radius: 12px; display: block; box-shadow: var(--shadow-sm); }
  .material-symbols-outlined { font-family: 'Material Symbols Outlined'; font-size: 1.25rem; line-height: 1; vertical-align: middle; color: var(--accent); }
</style>
</head>
<body>

<header>
  <div class="header-icon">🍳</div>
  <div class="header-titles">
    <h1>Chef Gemini</h1>
    <p>Your AI Culinary Assistant &amp; Meal Planner</p>
  </div>
</header>

<div id="main-container">
  <div id="log"></div>

  <!-- Clickable Example Prompts Row -->
  <div class="prompts-container">
    <div class="prompts-title">Try an example query</div>
    <div class="prompts-row">
      <button type="button" class="prompt-chip" onclick="sendPrompt('What recipes can I make with ingredients in my pantry?')">
        <span class="chip-icon">🥫</span> Pantry Recipe Search
      </button>
      <button type="button" class="prompt-chip" onclick="sendPrompt('Find a healthy dinner recipe and generate a photo of it')">
        <span class="chip-icon">📸</span> Recipe Photo Generator
      </button>
      <button type="button" class="prompt-chip" onclick="sendPrompt('Remember that I am vegetarian and allergic to peanuts')">
        <span class="chip-icon">🥗</span> Dietary Preferences
      </button>
    </div>
  </div>

  <form id="form">
    <input id="input" placeholder="Ask Chef Gemini for recipe recommendations, meal plans, or pantry checks…" autocomplete="off" autofocus>
    <button type="submit" class="send-btn">
      <span>Send</span>
      <span class="material-symbols-outlined" style="font-size:1.1rem; color:#fff;">send</span>
    </button>
  </form>
</div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function bubble(who) {
  const wrapper = el("div", "msg-wrapper " + who);
  const header = el("div", "msg-header");
  
  if (who === "user") {
    header.textContent = "You";
  } else {
    header.textContent = "🍳 Chef Gemini";
  }
  
  const b = el("div", "bubble");
  wrapper.appendChild(header);
  wrapper.appendChild(b);
  log.appendChild(wrapper);
  log.scrollTop = log.scrollHeight;
  return b;
}

function sendPrompt(promptText) {
  input.value = promptText;
  form.dispatchEvent(new Event("submit", { cancelable: true, bubbles: true }));
}

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */
function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) b.appendChild(el("div", null, textStr));

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  const b = bubble("agent"); b.textContent = "Thinking of delicious ideas…";
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
